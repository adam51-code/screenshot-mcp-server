name = "screenshot-mcp-server"
main = "src/index.js"
compatibility_date = "2026-09-17"
compatibility_flags = ["nodejs_compat"]

[browser]
binding = "BROWSER"

[ai]
binding = "AI"

[alias]
playwright = "@cloudflare/playwright"

[[r2_buckets]]
binding = "SCREENSHOTS"
bucket_name = "screenshot-storage"

[vars]
MCP_AUTH_TOKEN = "myMakeServer2026!"
PUBLIC_URL_BASE = "https://screenshot-mcp-server.adam-efc.workers.dev"
